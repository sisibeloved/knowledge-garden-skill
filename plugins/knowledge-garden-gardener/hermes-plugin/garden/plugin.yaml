name: garden
version: 0.6.0
description: "知识花园园丁 plugin 的 Hermes 薄包装。把 garden CLI 的 6 个入口(init/weekly-audit/apply-approved/triage-inbox/review-orphans/capture)注册为 Hermes tool 和 hermes garden 子命令,内部 subprocess 调 garden。前置:需先 pip install knowledge-garden-gardener 使 garden 命令可用。"
author: luchen
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - garden_init
  - garden_weekly_audit
  - garden_apply_approved
  - garden_triage_inbox
  - garden_review_orphans
  - garden_capture
